version: '3.8'

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: anvil-test-node
    command:
      [
        'anvil',
        '--host',
        '0.0.0.0',
        '--port',
        '8545',
        '--chain-id',
        '8453',
        '--fork-url',
        'https://mainnet.base.org',
        '--block-time',
        '1',
      ]
    ports:
      - '8545:8545'
    healthcheck:
      test: ['CMD-SHELL', 'cast block-number --rpc-url http://127.0.0.1:8545 || exit 1']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  rpc-gateway:
    image: node:20-alpine
    container_name: local-rpc-gateway
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./package.json:/app/package.json:ro
    environment:
      - PORT=3000
      - ANVIL_URL=http://anvil:8545
    ports:
      - '3000:3000'
    command: ['node', 'scripts/local-rpc-gateway.js']
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  e2e-runner:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    container_name: playwright-e2e-runner
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - BASE_URL=http://rpc-gateway:3000
      - CI=true
      - REPORT_FOLDER=api-tests-local-node
    depends_on:
      rpc-gateway:
        condition: service_healthy
    command: >
      sh -c "npm install -g pnpm@8.15.4 &&
             pnpm install --frozen-lockfile &&
             npx playwright test tests/api/rpc.spec.ts --project=api"
