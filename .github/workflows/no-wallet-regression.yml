name: 'No-wallet Regression Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for no-wallet regression tests (leave empty to use default staging URL)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  no-wallet-regression-tests:
    name: 'No-wallet Regression Tests'
    uses: './.github/workflows/reusable-no-wallet.yml'
    with:
      baseUrl: '${{ inputs.baseUrl }}'
      script: 'ci:no-wallet-regression'
