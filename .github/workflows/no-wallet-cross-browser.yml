name: 'No-wallet Cross-browser Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for cross-browser tests (leave empty to use default staging URL)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cross-browser-tests:
    name: 'No-wallet Cross-browser Tests'
    uses: './.github/workflows/reusable-no-wallet-cross-browser.yml'
    secrets: inherit
    with:
      baseUrl: '${{ inputs.baseUrl }}'
