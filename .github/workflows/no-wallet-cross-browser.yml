name: 'No-wallet Cross-browser Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for cross-browser tests'
        type: 'string'
        default: 'https://staging.supersmooth.fi/'

permissions:
  contents: read

jobs:
  cross-browser-tests:
    name: 'No-wallet Cross-browser Tests'
    uses: './.github/workflows/reusable-no-wallet-cross-browser.yml'
    with:
      baseUrl: '${{ inputs.baseUrl }}'
