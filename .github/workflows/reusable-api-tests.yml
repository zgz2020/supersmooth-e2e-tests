name: '⚙️ [Reusable] API Tests'

on:
  workflow_call:
    inputs:
      baseUrl:
        description: 'Base URL for the tests (falls back to vars.DEFAULT_BASE_URL or staging default)'
        type: 'string'
        required: false
        default: ''
      script:
        description: 'pnpm script to run (e.g. test:api)'
        type: 'string'
        default: 'test:api'

permissions:
  contents: read

jobs:
  api-tests:
    name: 'Run API Tests'
    runs-on: 'ubuntu-24.04'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 2 # Ensures HEAD~1 is available for AI failure triage diffs

      - name: 'Setup pnpm'
        uses: 'pnpm/action-setup@v4'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: 'Run tests'
        env:
          BASE_URL: "${{ inputs.baseUrl != '' && inputs.baseUrl || vars.DEFAULT_BASE_URL || 'https://staging.supersmooth.fi' }}"
        run: 'pnpm "${{ inputs.script }}"'

      - name: '🤖 AI Agent Test Triage'
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pnpm agent:triage

      - name: 'Upload AI Triage Report'
        uses: 'actions/upload-artifact@v4'
        if: failure()
        with:
          name: 'ai-triage-report-api-tests'
          path: 'ai-reports'
          retention-days: 30

      - name: 'Upload Playwright Report'
        uses: 'actions/upload-artifact@v4'
        if: always()
        with:
          name: 'api-tests'
          path: 'playwright-reports/api-tests'
          retention-days: 30
