name: 'With-wallet Regression Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for with-wallet regression tests (leave empty to use default staging URL)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  with-wallet-regression-tests:
    name: 'With-wallet Regression Tests'
    uses: './.github/workflows/reusable-with-wallet.yml'
    secrets: inherit
    with:
      baseUrl: '${{ inputs.baseUrl }}'
      script: 'ci:with-wallet-regression'
