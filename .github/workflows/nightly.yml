name: 'Nightly Run'

on:
  schedule:
    - cron: '0 1 * * 1,3,5'

permissions:
  contents: read

jobs:
  api-tests:
    uses: './.github/workflows/reusable-api-tests.yml'
    secrets: inherit
    with:
      script: 'test:api'

  no-wallet-tests:
    uses: './.github/workflows/reusable-no-wallet.yml'
    secrets: inherit
    with:
      script: 'ci:no-wallet'

  cross-browser-tests:
    uses: './.github/workflows/reusable-no-wallet-cross-browser.yml'
    secrets: inherit

  with-wallet-tests:
    uses: './.github/workflows/reusable-with-wallet.yml'
    secrets: inherit
    with:
      script: 'ci:with-wallet'
