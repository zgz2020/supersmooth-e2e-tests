name: 'Nightly Run'

on:
  schedule:
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  api-tests:
    uses: './.github/workflows/reusable-api-tests.yml'
    secrets: inherit
    with:
      script: 'test:api'

  no-wallet-tests:
    uses: './.github/workflows/reusable-no-wallet.yml'
    secrets: inherit
    with:
      script: 'ci:no-wallet'

  cross-browser-tests:
    uses: './.github/workflows/reusable-no-wallet-cross-browser.yml'
    secrets: inherit

  with-wallet-tests:
    uses: './.github/workflows/reusable-with-wallet.yml'
    secrets: inherit
    with:
      script: 'ci:with-wallet'

  anvil-tests:
    # Off until CI can start aphelion-app (needs APHELION_STATUS_TOKEN + APHELION_APP_ENV secrets).
    # Enable with repo variable RUN_ANVIL_NIGHTLY=true (Settings → Secrets and variables → Actions → Variables).
    if: vars.RUN_ANVIL_NIGHTLY == 'true'
    uses: './.github/workflows/reusable-anvil-tests.yml'
    secrets: inherit
    with:
      script: 'ci:anvil'

  performance-tests:
    uses: './.github/workflows/reusable-performance-tests.yml'
    secrets: inherit
    with:
      profile: 'smoke'
      scenario: 'all'
