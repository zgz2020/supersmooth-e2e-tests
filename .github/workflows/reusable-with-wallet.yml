name: '⚙️ [Reusable] With-wallet Tests'

on:
  workflow_call:
    inputs:
      baseUrl:
        description: 'Base URL for the tests (falls back to vars.DEFAULT_BASE_URL or staging default)'
        type: 'string'
        required: false
        default: ''
      script:
        description: 'pnpm script to run (e.g. ci:with-wallet)'
        type: 'string'
        default: 'ci:with-wallet'

permissions:
  contents: read

jobs:
  with-wallet-tests:
    name: 'Run with-wallet tests'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 2 # Ensures HEAD~1 is available for AI failure triage diffs

      - name: 'Setup pnpm'
        uses: 'pnpm/action-setup@v4'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: Install xvfb
        run: apt-get update -y && apt-get -y install xvfb && rm -rf /var/lib/apt/lists/* /var/cache/apt/*

      - name: Build Synpress cache
        env:
          BASE_URL: "${{ inputs.baseUrl != '' && inputs.baseUrl || vars.DEFAULT_BASE_URL || 'https://staging.supersmooth.fi' }}"
          TEST_WALLET_PK: ${{ secrets.TEST_WALLET_PK }}
          TEST_WALLET_ADDRESS: ${{ secrets.TEST_WALLET_ADDRESS }}
        run: pnpm ci:synpress-build-cache:base

      - name: 'Run tests'
        env:
          BASE_URL: "${{ inputs.baseUrl != '' && inputs.baseUrl || vars.DEFAULT_BASE_URL || 'https://staging.supersmooth.fi' }}"
          TEST_WALLET_PK: ${{ secrets.TEST_WALLET_PK }}
          TEST_WALLET_ADDRESS: ${{ secrets.TEST_WALLET_ADDRESS }}
        run: 'pnpm "${{ inputs.script }}"'

      - name: '🤖 AI Agent Test Triage'
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pnpm agent:triage

      - name: 'Upload AI Triage Report'
        uses: 'actions/upload-artifact@v4'
        if: failure()
        with:
          name: 'ai-triage-report-with-wallet'
          path: 'ai-reports'
          retention-days: 30

      - name: 'Upload Playwright Report'
        uses: 'actions/upload-artifact@v4'
        if: always()
        with:
          name: 'with-wallet'
          path: 'playwright-reports/with-wallet'
          retention-days: 30
