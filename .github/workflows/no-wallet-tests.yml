name: 'No-wallet Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for no-wallet tests (leave empty to use default staging URL)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  no-wallet-tests:
    name: 'No-wallet Tests'
    uses: './.github/workflows/reusable-no-wallet.yml'
    secrets: inherit
    with:
      baseUrl: '${{ inputs.baseUrl }}'
      script: 'ci:no-wallet'
