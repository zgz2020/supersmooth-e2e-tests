name: 'API Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for API tests'
        required: true
        default: 'https://aphelion-app.onrender.com/'
        type: 'string'

permissions:
  contents: read

jobs:
  api-tests:
    name: 'Run API Tests'
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Setup pnpm'
        uses: 'pnpm/action-setup@v4'
        with:
          version: 8

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: 'Run API tests'
        env:
          BASE_URL: '${{ inputs.baseUrl }}'
          REPORT_FOLDER: 'api'
          CI: 'true'
        run: 'pnpm test:api'

      - name: 'Upload Playwright Report'
        uses: 'actions/upload-artifact@v4'
        if: '!cancelled()'
        with:
          name: 'playwright-report-api'
          path: 'playwright-reports/api'
          retention-days: 30
