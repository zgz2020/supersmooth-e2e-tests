name: 'API Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for API tests (leave empty to use default staging URL)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  api-tests:
    name: 'API Tests'
    uses: './.github/workflows/reusable-api-tests.yml'
    secrets: inherit
    with:
      baseUrl: '${{ inputs.baseUrl }}'
      script: 'test:api'
