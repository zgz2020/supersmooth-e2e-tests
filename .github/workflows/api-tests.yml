name: 'API Tests'

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL for API tests'
        type: 'string'
        default: 'https://staging.supersmooth.fi/'

permissions:
  contents: read

jobs:
  api-tests:
    name: 'API Tests'
    uses: './.github/workflows/reusable-api-tests.yml'
    with:
      baseUrl: '${{ inputs.baseUrl }}'
      script: 'test:api'
