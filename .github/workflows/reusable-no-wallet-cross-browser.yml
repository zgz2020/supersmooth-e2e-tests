name: '⚙️ [Reusable] No-wallet Cross-browser Tests'

on:
  workflow_call:
    inputs:
      baseUrl:
        description: 'Base URL for cross-browser tests (falls back to vars.DEFAULT_BASE_URL or staging default)'
        type: 'string'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cross-browser-tests:
    name: '${{ matrix.browser.name }}'
    runs-on: 'ubuntu-24.04'
    container:
      image: 'mcr.microsoft.com/playwright:v1.49.0-noble'
    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: 'Desktop Firefox'
            project: 'firefox'
          - name: 'Desktop Safari'
            project: 'webkit'
          - name: 'Mobile Safari (iPhone 14)'
            project: 'mobile-safari'
          - name: 'Mobile Android (Pixel 7)'
            project: 'mobile-android'
          - name: 'Tablet (iPad Pro 11)'
            project: 'tablet-ipad'
          - name: 'Desktop Large (1920x1080)'
            project: 'desktop-large'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0 # Ensures full commit history is available for AI failure triage diffs

      - name: 'Configure Git Safe Directory'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 'Setup pnpm'
        uses: 'pnpm/action-setup@v4'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: 'Install xvfb'
        run: 'apt-get update -y && apt-get -y install xvfb && rm -rf /var/lib/apt/lists/* /var/cache/apt/*'

      - name: 'Run cross-browser tests'
        env:
          BASE_URL: "${{ inputs.baseUrl != '' && inputs.baseUrl || vars.DEFAULT_BASE_URL || 'https://staging.supersmooth.fi' }}"
          REPORT_FOLDER: 'cross-browser-${{ matrix.browser.project }}'
          # Firefox refuses to run as root when $HOME is owned by another user (/github/home -> pwuser)
          HOME: '/root'
        run: 'xvfb-run pnpm playwright test --project=${{ matrix.browser.project }}'

      - name: '🤖 AI Agent Test Triage'
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HOME: '/root'
        run: pnpm agent:triage

      - name: '🩹 Autonomous Self-Healing PR Generator'
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: "${{ inputs.baseUrl != '' && inputs.baseUrl || vars.DEFAULT_BASE_URL || 'https://staging.supersmooth.fi' }}"
          HOME: '/root'
        run: node scripts/qa-agent/heal-agent.js --create-pr --suite=cross-browser

      - name: 'Upload AI Triage Report'
        uses: 'actions/upload-artifact@v4'
        if: failure()
        with:
          name: 'ai-triage-report-${{ matrix.browser.project }}'
          path: 'ai-reports'
          retention-days: 30

      - name: '💬 Post AI Triage Sticky Comment to PR'
        if: failure() && github.event_name == 'pull_request'
        uses: 'actions/github-script@v7'
        with:
          script: |
            const fs = require('fs');
            const commentFile = `ai-reports/latest-github-comment-cross-browser.md`;
            const fallbackFile = 'ai-reports/latest-github-comment.md';
            const targetPath = fs.existsSync(commentFile) ? commentFile : fallbackFile;
            if (!fs.existsSync(targetPath)) return;

            const triageMarkdown = fs.readFileSync(targetPath, 'utf8');
            const commentHeader = `<!-- ai-qa-triage-cross-browser-${context.payload.matrix?.browser?.project || 'cb'} -->`;
            const commentBody = `${commentHeader}\n${triageMarkdown}`;
            const issueNumber = context.issue.number;
            if (!issueNumber) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(commentHeader));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log(`Updated sticky triage comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
              console.log('Created new sticky triage comment on PR');
            }

      - name: 'Upload test report artifact'
        if: 'always()'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'cross-browser-${{ matrix.browser.project }}'
          path: 'playwright-reports/cross-browser-${{ matrix.browser.project }}'
          retention-days: 30
